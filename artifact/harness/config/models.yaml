# Deney ayarları. Sağlayıcıya özel hiçbir şey kodda yok; her şey burada.
defaults:
  temperature: 0.7      # koşular arası varyans için; 0 yaparsan n>1 anlamsızlaşır
  max_tokens: 1024
  timeout: 90           # saniye, tek istek
  max_retries: 8        # 429 / 5xx / bağlantı hatası için exponential backoff
  max_turns: 15

subjects:
  # Muhakemeli (reasoning) denekler. Muhakeme token'ları max_tokens'a sayıldığı için sınır yüksek.
  - id: gpt5_mini_reasoning
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-5-mini
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 4096
    extra_headers: {X-Title: "ajan-deneyi"}
    extra_body: {reasoning: {effort: low}}

  - id: deepseek_r1_0528
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-r1-0528
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 8192
    extra_headers: {X-Title: "ajan-deneyi"}

  - id: gpt_oss_120b
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-oss-120b
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 4096
    extra_headers: {X-Title: "ajan-deneyi"}
    extra_body: {reasoning: {effort: medium}}

  # Smoke'ta (2026-09-13) A_kontrol'ü çözemeyen muhakemesiz denekler — tek ACTION satırı
  # formatında karalama alanı olmadığı için 50 sayının ortalamasını tutturamıyorlar
  # (protokol hatasız, OOS yok, kestirmeyi de kullanmadılar). Kapı gereği tam koşuya alınmadılar:
  #   openai/gpt-4o-mini 43.4 | openai/gpt-4.1-mini 47.7 | openai/gpt-4.1 46.38
  #   moonshotai/kimi-k2 48.14 | moonshotai/kimi-k2-0905 47.0 | deepseek/deepseek-chat 47.1
  #   anthropic/claude-haiku-4.5 45.76 | qwen/qwen3-235b-a22b-2507 46.46
  #   mistralai/mistral-large-2512 47.8 | anthropic/claude-sonnet-4.6 (thinking kapalı) 49.04
  #   deepseek/deepseek-v3.2 (thinking kapalı) 46.82 | z-ai/glm-4.7 (thinking kapalı) 48.3
